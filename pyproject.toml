[build-system]
# PEP 639(license as SPDX 문자열 + license-files)을 경고 없이 쓰려면
# setuptools>=77.0 필요(2026-11-12 패키징 점검 발견 — `license = { text = "MIT" }`
# 테이블 형식은 deprecated, 2027-02-18부터 빌드가 깨질 예정이라 SPDX 문자열로 전환).
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hair-platform"
version = "0.1.4"
description = "HAIR(Human-AI Resource Management) 협업 플랫폼 — 사람과 AI Agent를 하나의 조직도에서 배치·배분·승인·성과리뷰하는 도구. AgentForge의 자매 프로젝트."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.110.0",
    # `app.py`가 `starlette.middleware.sessions.SessionMiddleware`를 최상위에서
    # 직접 import한다(2026-10-27 패키징 점검 발견) — 지금까지 fastapi의
    # 전이 의존성으로 같이 깔려서 별도 선언 없이도 동작은 했지만, 코드가
    # 직접 import하는 패키지를 전이 의존성에만 기대는 건 fastapi가 내부
    # 의존성을 바꾸면 조용히 깨질 수 있는 암묵적 가정이다 — 명시한다.
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
    "agent-evaluator[sdk]>=1.1.1",
    "python-dotenv>=1.0.0",
    # `llm.py`/`vectorstore.py`/`model_registry.py`/`websearch.py` 4곳이
    # 전부 지연 import로 httpx를 쓴다(2026-10-27 패키징 점검 발견) —
    # Ollama(API 키 없이 쓰는 기본 provider) 호출·임베딩·모델 목록 조회·
    # 실시간 웹 검색(Tavily)이 전부 이걸 거친다. 지금까지 `llm`/`dev`
    # extra에만 선언돼 있어, 둘 다 설치 안 하고 documents 등 다른 extra만
    # 설치하면 Ollama 관련 기능이 전부 `ModuleNotFoundError`로 깨졌다 —
    # 여러 핵심 기능이 공유하는 의존성이라 기본 의존성으로 옮긴다.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.5.0"]
# llm.py가 지연 import한다 — use_llm=True 경로를 실제로 쓸 때만 필요하다.
# Ollama는 로컬 서버(기본 http://localhost:11434)가 별도로 떠 있어야 한다.
# (httpx는 기본 의존성으로 옮겨 여기 다시 적지 않는다 — 위 `dependencies` 주석 참고.)
llm = ["anthropic>=0.34.0", "openai>=1.40.0"]
# crew_runtime.py가 지연 import한다 — framework="crewai" 경로를 쓸 때만 필요하다.
# 주의: crewai/litellm은 import 시점에 자체적으로 .env를 읽는다(수입 부작용).
# `litellm`을 명시한 이유(2026-10-19 실측 버그) — crewai>=1.6부터 LLM
# 클래스가 openai/anthropic/azure/google/bedrock만 "네이티브 provider"로
# 직접 다루고, 그 외(ollama 포함)는 litellm로 폴백한다. 예전엔 litellm이
# crewai의 전이 의존성으로 같이 깔려서 신경 쓸 일이 없었는데, 지금
# 버전은 litellm을 선택적 의존성으로 뺐다 — 설치 안 돼 있으면 ollama로
# `run_crew()`를 돌릴 때마다 즉시 `ImportError: Fallback to LiteLLM is
# not available`로 실패한다(실제로 "자율 개발 크루"가 ollama로 Crew를
# 실행하다 재현). 단일 Agent 경로(`llm.call_llm()`)는 litellm을 안 거쳐
# 영향 없었다 — 그래서 이 버그가 지금까지 안 드러났다.
crewai = ["crewai>=1.0.0", "litellm>=1.0.0"]
# crew_runtime.py의 _mcp_tools()가 지연 import한다 — Agent에 mcp_servers를
# 실제로 설정했을 때만 필요하다(ADR 결정 10, 2026-09-27). MCPServerAdapter는
# 생성 시점에 실제로 MCP 서버에 접속을 시도한다 — 접속 가능한 서버가 없으면
# 이 extra를 설치해도 mcp_servers를 빈 배열로 둔 채면 아무 영향이 없다.
# `mcp<2.0` 상한(2026-10-19 실측 버그) — `crewai-tools`가 쓰는
# `mcpadapt==0.1.19`는 `mcp.client.streamable_http.streamablehttp_client`
# (언더스코어 없이)를 import하는데, `mcp>=2.0`은 이 함수를
# `streamable_http_client`(언더스코어 있게)로 이름을 바꿨다 — 둘 다
# 하한만 선언해 pip가 최신 `mcp 2.2.0`을 깔면 이 import가 깨진다.
# `crewai_tools.adapters.mcp_adapter`는 이 ImportError를 "mcp 패키지가
# 아예 없다"로 오인해 `MCP_AVAILABLE=False`로 떨어뜨리고, MCP 도구가
# 달린 Agent(예: "코드 검증가"의 recommend-fix-workflow 스킬)를 실행할
# 때마다 터미널에 "You are missing the 'mcp' package. Would you like to
# install it?"를 대화형으로 물어본다 — 백그라운드/서버 프로세스엔
# stdin이 없어 그 자리에서 예외로 죽는다(실제로 파이프라인 "코드 검증"
# 단계가 이렇게 실패하는 걸 확인). `mcpadapt`가 새 이름을 따라잡을
# 때까지 `mcp`를 1.x로 묶어둔다.
mcp = ["crewai-tools[mcp]>=1.0.0", "mcp>=1.10.1,<2.0"]
# documents.py가 지연 import한다 — 대화창/지식 자료실에서 .pdf·.html
# 파일을 업로드했을 때만 필요하다(.md/.txt는 추가 라이브러리 없이 그대로
# 처리한다). pypdf는 순수 Python(시스템 의존성 없음), beautifulsoup4는
# 표준 라이브러리 html.parser를 백엔드로 써서(lxml 불필요) 로컬/온프레미스
# 우선 원칙과 맞는다.
documents = ["pypdf>=4.0.0", "beautifulsoup4>=4.12.0"]
# 사용자 요청(2026-10-27, "pip 방식 설치 관련으로 HAIR-Platform 의존성 및
# 포함되는 파일들을 점검하고 현행화") 중 발견 — `tests/unit`의 CrewAI
# 관련 9개 파일은 `from crewai... import ...`를 테스트 함수 안에서(수집
# 시점이 아니라 실행 시점에) 하므로 `pip install -e ".[dev]"`만으로
# `pytest tests/ -q`를 돌리면 그 테스트들에서 `ModuleNotFoundError`가
# 난다(README가 예전부터 "[dev]만 설치하면 전체 골든셋이 오프라인으로
# 통과한다"고 안내해 온 것과 실제가 어긋나 있었다 — `test_documents.py`
# 만 `pytest.importorskip()`으로 이 문제를 스스로 막고 있었다). 전체
# 테스트 스위트를 깨끗하게 돌리려면 필요한 extra 전부를 한 번에 설치할
# 수 있는 묶음을 따로 둔다(README "빠른 시작"이 이걸 쓰도록 갱신됨).
all = [
    "crewai>=1.0.0",
    "litellm>=1.0.0",
    "crewai-tools[mcp]>=1.0.0",
    "mcp>=1.10.1,<2.0",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/bullpeng72/HAIR-Platform"
Repository = "https://github.com/bullpeng72/HAIR-Platform"
Issues = "https://github.com/bullpeng72/HAIR-Platform/issues"

[project.scripts]
# 통합 CLI(2026-10-10) — `hair serve`/`hair bootstrap-admin`/`hair eval`
# 하나의 진입점 아래로 모은다(src/hair_platform/cli.py). 이전엔 콜드스타트용
# 콘솔 스크립트(hair-platform-bootstrap-admin)만 따로 있었는데, 지금은
# `hair bootstrap-admin`이 그 자리를 대신한다 — 두 진입점을 동시에 유지하지
# 않는다(bootstrap.py의 `bootstrap_admin()`/`main()` 자체는 그대로 남아있고
# 테스트도 그 함수를 직접 쓴다 — 지워진 건 콘솔 스크립트 등록뿐).
hair = "hair_platform.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# crewai 설치 후 발견: 이 개발 환경(공유 conda env)에 이미 있는 arize-phoenix가
# pytest 플러그인을 자동 등록하는데, crewai의 의존성(pydantic-ai 등)과 버전이
# 어긋나면서 phoenix의 import 자체가 깨져 pytest 실행 전체가 막힌다(이 프로젝트와
# 무관한 플러그인) — 이 프로젝트 범위에서만 명시적으로 비활성화한다.
addopts = "-p no:phoenix"

[tool.ruff.lint]
# B008: FastAPI의 Depends()는 함수 기본값 호출이 의도된 패턴이다(FastAPI 공식 권장) — 오탐 무시.
ignore = ["B008"]
