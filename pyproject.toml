[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hair-platform"
version = "0.0.3"
description = "HAIR(Human-AI Resource Management) 협업 플랫폼 — 사람과 AI Agent를 하나의 조직도에서 배치·배분·승인·성과리뷰하는 도구. AgentForge의 자매 프로젝트."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
    "agent-evaluator[sdk]>=1.1.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.5.0", "httpx>=0.27.0"]
# llm.py가 지연 import한다 — use_llm=True 경로를 실제로 쓸 때만 필요하다.
# Ollama는 로컬 서버(기본 http://localhost:11434)가 별도로 떠 있어야 한다.
llm = ["anthropic>=0.34.0", "openai>=1.40.0", "httpx>=0.27.0"]
# crew_runtime.py가 지연 import한다 — framework="crewai" 경로를 쓸 때만 필요하다.
# 주의: crewai/litellm은 import 시점에 자체적으로 .env를 읽는다(수입 부작용).
crewai = ["crewai>=1.0.0"]
# crew_runtime.py의 _mcp_tools()가 지연 import한다 — Agent에 mcp_servers를
# 실제로 설정했을 때만 필요하다(ADR 결정 10, 2026-09-27). MCPServerAdapter는
# 생성 시점에 실제로 MCP 서버에 접속을 시도한다 — 접속 가능한 서버가 없으면
# 이 extra를 설치해도 mcp_servers를 빈 배열로 둔 채면 아무 영향이 없다.
mcp = ["crewai-tools[mcp]>=1.0.0"]

[project.scripts]
# 통합 CLI(2026-10-10) — `hair serve`/`hair bootstrap-admin`/`hair eval`
# 하나의 진입점 아래로 모은다(src/hair_platform/cli.py). 이전엔 콜드스타트용
# 콘솔 스크립트(hair-platform-bootstrap-admin)만 따로 있었는데, 지금은
# `hair bootstrap-admin`이 그 자리를 대신한다 — 두 진입점을 동시에 유지하지
# 않는다(bootstrap.py의 `bootstrap_admin()`/`main()` 자체는 그대로 남아있고
# 테스트도 그 함수를 직접 쓴다 — 지워진 건 콘솔 스크립트 등록뿐).
hair = "hair_platform.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# crewai 설치 후 발견: 이 개발 환경(공유 conda env)에 이미 있는 arize-phoenix가
# pytest 플러그인을 자동 등록하는데, crewai의 의존성(pydantic-ai 등)과 버전이
# 어긋나면서 phoenix의 import 자체가 깨져 pytest 실행 전체가 막힌다(이 프로젝트와
# 무관한 플러그인) — 이 프로젝트 범위에서만 명시적으로 비활성화한다.
addopts = "-p no:phoenix"

[tool.ruff.lint]
# B008: FastAPI의 Depends()는 함수 기본값 호출이 의도된 패턴이다(FastAPI 공식 권장) — 오탐 무시.
ignore = ["B008"]
