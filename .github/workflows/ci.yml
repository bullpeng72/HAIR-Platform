name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Tests + lint (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      # `all`(crewai+mcp+llm+documents+graph+korean+vectordb)까지 설치해야 전체 테스트가 돈다
      # (CrewAI 연동 테스트는 실행 시점에 `from crewai ... import`를 한다 — 2026-10-27 패키징 점검).
      # `-c constraints.txt`(2026-11-25, P0-2) — 하한만 둔 의존성을 그대로 설치하면 설치 시점마다 다른 버전이
      # 깔린다(실측: CI가 crewai 1.6.1·pydantic 2.14를 받아 1.15 기준 코드와 어긋남). 개발 PC에서 전체 테스트를
      # 통과한 조합(`scripts/update_constraints.py`가 생성)으로 똑같이 설치한다.
      - run: pip install -e ".[dev,all]" -c constraints.txt
      # 의존성 충돌 표시(참고용) — crewai가 고정한 일부 패키지와의 알려진 경고가 있어 실패로 치지 않는다.
      - name: Show dependency conflicts (informational)
        run: pip check || true
      # tiktoken 인코딩 표 미리 받기 — 테스트는 외부 네트워크를 막는다(tests/conftest.py). 개발 PC에는 캐시가 있어
      # 실제 토크나이저로 세므로, CI도 같은 조건이 되게 테스트 전에 받아 둔다(없어도 글자 수 대체로 동작은 한다).
      - name: Warm tiktoken cache
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      # 테스트는 `.env`·셸 API 키에 기대지 않는다(tests/conftest.py가 격리) — 키 없는 CI에서도 개발 PC와 같은 결과.
      - run: pytest tests/ -q -p no:cacheprovider
      # 검사 규칙은 pyproject.toml `[tool.ruff.lint] select`에 명시(ruff 버전마다 기본값이 달라지지 않게).
      - run: ruff check src tests
      # black은 쓰지 않는다(2026-11-25 결정) — 기존 코드 전체(171개 파일·약 11,700줄)가 black 형식이 아니고, 일괄
      # 재포맷은 이력 비교를 끊는다. 형식 대신 ruff로 실제 오류·버그 패턴만 검사한다.
      # Gate A-G CI 잡은 아직 없다 — Harness Autopilot이 이 저장소에 설치되지 않아(.aoo/ 없음) claims audit 잡도 해당 없다.
