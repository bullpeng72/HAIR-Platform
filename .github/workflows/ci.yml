name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Tests + lint (pytest, ruff)
    runs-on: ubuntu-latest
    # 멈춘 테스트가 기본 6시간 동안 러너를 잡지 않게(2026-11-25 — 평소 약 20분)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      # `all`(crewai+mcp+llm+documents+graph+korean+vectordb)까지 설치해야 전체 테스트가 돈다
      # (CrewAI 연동 테스트는 실행 시점에 `from crewai ... import`를 한다 — 2026-10-27 패키징 점검).
      # `-c constraints.txt`(2026-11-25, P0-2) — 하한만 둔 의존성을 그대로 설치하면 설치 시점마다 다른 버전이
      # 깔린다(실측: CI가 crewai 1.6.1·pydantic 2.14를 받아 1.15 기준 코드와 어긋남). 개발 PC에서 전체 테스트를
      # 통과한 조합(`scripts/update_constraints.py`가 생성)으로 똑같이 설치한다.
      - run: pip install -e ".[dev,all]" -c constraints.txt
      # 의존성 충돌 표시(참고용) — crewai가 고정한 일부 패키지와의 알려진 경고가 있어 실패로 치지 않는다.
      - name: Show dependency conflicts (informational)
        run: pip check || true
      # tiktoken 인코딩 표 미리 받기 — 테스트는 외부 네트워크를 막는다(tests/conftest.py). 개발 PC에는 캐시가 있어
      # 실제 토크나이저로 세므로, CI도 같은 조건이 되게 테스트 전에 받아 둔다(없어도 글자 수 대체로 동작은 한다).
      - name: Warm tiktoken cache
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      # 테스트는 `.env`·셸 API 키에 기대지 않는다(tests/conftest.py가 격리) — 키 없는 CI에서도 개발 PC와 같은 결과.
      - run: pytest tests/ -q -p no:cacheprovider
      # 검사 규칙은 pyproject.toml `[tool.ruff.lint] select`에 명시(ruff 버전마다 기본값이 달라지지 않게).
      - run: ruff check src tests
      # black은 쓰지 않는다(2026-11-25 결정) — 기존 코드 전체(171개 파일·약 11,700줄)가 black 형식이 아니고, 일괄
      # 재포맷은 이력 비교를 끊는다. 형식 대신 ruff로 실제 오류·버그 패턴만 검사한다.

  # 화면 자동 테스트(2026-11-26, 개선 계획 2-1) — 실제 서버 + Chromium(Playwright). 본 테스트와 따로 돈다.
  e2e:
    name: Screen tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: pip install -e ".[dev,all,e2e]" -c constraints.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -q -p no:cacheprovider

  # 외부 연결 통합 테스트(2026-11-26, 개선 계획 2-2) — 실제 PostgreSQL·MySQL·메일 서버(GreenMail)를 Docker 서비스로.
  # 사내 DB 조회(읽기 전용·시간 상한), 메일 수신함(인증서 검증·읽음 표시 유지), 메일 알림 도착을 실제 서버로 확인한다.
  integration:
    name: External connections (Docker services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hairpw
          POSTGRES_DB: hair_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hairpw
          MYSQL_DATABASE: hair_it
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -phairpw" --health-interval 5s --health-timeout 5s --health-retries 30
      greenmail:
        image: greenmail/standalone:2.0.1
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=hair:hairpw@example.com -Dgreenmail.users.login=local_part"
        ports: ["3025:3025", "3993:3993"]
    env:
      HAIR_IT_PG: "127.0.0.1:5432/hair_it"
      HAIR_IT_PG_USER: postgres
      HAIR_IT_PG_PASSWORD: hairpw
      HAIR_IT_MYSQL: "127.0.0.1:3306/hair_it"
      HAIR_IT_MYSQL_USER: root
      HAIR_IT_MYSQL_PASSWORD: hairpw
      HAIR_IT_MAIL_HOST: 127.0.0.1
      HAIR_IT_SMTP_PORT: "3025"
      HAIR_IT_IMAPS_PORT: "3993"
      HAIR_IT_MAIL_USER: hair
      HAIR_IT_MAIL_PASSWORD: hairpw
      HAIR_IT_MAIL_ADDRESS: hair@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: pip install -e ".[dev,all,dbconnect]" -c constraints.txt
      - run: pytest tests/integration -q -p no:cacheprovider -rs

      # Gate A-G CI 잡은 아직 없다 — Harness Autopilot이 이 저장소에 설치되지 않아(.aoo/ 없음) claims audit 잡도 해당 없다.
