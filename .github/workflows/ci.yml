name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Tests + lint (pytest, ruff, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 2026-10-27 패키징 점검 발견 — `tests/unit`의 CrewAI 연동 테스트
      # 9개가 테스트 함수 안에서(수집 시점이 아니라 실행 시점에)
      # `from crewai... import ...`를 하는데, `[dev]`만 설치하면
      # crewai가 없어 그 테스트들이 `ModuleNotFoundError`로 깨진다
      # (README "빠른 시작"의 같은 문제와 원인 동일). `all`(=
      # crewai+mcp+llm+documents 묶음, pyproject.toml 참고)까지 같이
      # 설치해야 전체 골든셋이 통과한다.
      - run: pip install -e ".[dev,all]"
      - run: pytest tests/ -v
      - run: ruff check src tests
      - run: black --check --target-version py311 src tests
      # Gate A-G CI 잡은 아직 없다 — agent-evaluator SDK가 vendor/import되지 않아
      # Gate 평가 자체가 불가능하다. Harness Autopilot도 이
      # 저장소에는 설치되지 않아(.aoo/ 없음) claims audit 잡도 해당 없다.
